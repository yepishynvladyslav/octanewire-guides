<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
// ------------------------------------------------------------ setup
const Q = new URLSearchParams(location.search);
const FILM = Q.get('film') === '1';
if (FILM) document.body.classList.add('film');
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, ZOOM = 1;
function resize() {
  if (FILM) { W = 1080; H = 1920; DPR = 1; }
  else { DPR = Math.min(2, window.devicePixelRatio || 1); W = Math.floor(innerWidth * DPR); H = Math.floor(innerHeight * DPR); }
  cv.width = W; cv.height = H;
  ZOOM = FILM ? 2.05 : Math.min(W, H) / 640;
}
resize(); addEventListener('resize', resize);

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const PAL = ['#FF2E8B', '#2EE6FF', '#8B5CFF', '#FFB020', '#FF5ACD', '#4DF0C0'];

// ------------------------------------------------------------ world
const TILE = 320, N = 12, ROAD = 112, HALF = ROAD / 2;   // roads on every multiple of TILE, 0..N
const MAXC = N * TILE, OCEAN_X = MAXC + 70;               // ocean east of the last road
const BEACH_COL = N - 1;                                  // last column of blocks is beach
let rnd = mulberry32(1);
const buildings = [], palms = [], lamps = [];
function buildWorld(seed) {
  const r = mulberry32(seed); buildings.length = palms.length = lamps.length = 0;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const x0 = i * TILE + HALF + 14, y0 = j * TILE + HALF + 14, x1 = (i + 1) * TILE - HALF - 14, y1 = (j + 1) * TILE - HALF - 14;
    if (i === BEACH_COL) { for (let k = 0; k < 4; k++) palms.push([x0 + r() * (x1 - x0), y0 + r() * (y1 - y0), 14 + r() * 8]); continue; }
    const split = r();
    const parts = split < 0.3 ? [[x0, y0, x1, y1]] : split < 0.65
      ? [[x0, y0, (x0 + x1) / 2 - 6, y1], [(x0 + x1) / 2 + 6, y0, x1, y1]]
      : [[x0, y0, (x0 + x1) / 2 - 6, (y0 + y1) / 2 - 6], [(x0 + x1) / 2 + 6, y0, x1, (y0 + y1) / 2 - 6], [x0, (y0 + y1) / 2 + 6, x1, y1]];
    for (const p of parts) {
      if (r() < 0.12) { palms.push([(p[0] + p[2]) / 2, (p[1] + p[3]) / 2, 16]); continue; }
      const tall = r();
      buildings.push({ x0: p[0], y0: p[1], x1: p[2], y1: p[3], h: 0.12 + tall * tall * 0.45, col: PAL[Math.floor(r() * PAL.length)],
        roof: ['#1c1730', '#211a36', '#181428', '#251c3a'][Math.floor(r() * 4)], pad: r() < 0.18, ac: Math.floor(r() * 4), seed: r() });
    }
  }
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) if ((i + j) % 2 === 0) lamps.push([i * TILE + HALF + 6, j * TILE + HALF + 6]);
  for (let j = 0; j < N * 3; j++) palms.push([MAXC + HALF + 4 + (j % 2) * 4, j * TILE / 3 + 50, 13]);
}

// glow sprites
function glow(rgb, size) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(0.25, `rgba(${rgb},.45)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const G = { lamp: glow('255,176,80', 256), pink: glow('255,46,139', 256), cyan: glow('46,230,255', 256), red: glow('255,40,60', 256), blue: glow('60,110,255', 256), cash: glow('62,224,161', 128), white: glow('255,255,255', 128) };
const cone = (() => { const c = document.createElement('canvas'); c.width = 360; c.height = 220; const g = c.getContext('2d');
  const gr = g.createRadialGradient(0, 110, 0, 0, 110, 360); gr.addColorStop(0, 'rgba(255,240,220,.55)'); gr.addColorStop(1, 'rgba(255,240,220,0)');
  g.fillStyle = gr; g.beginPath(); g.moveTo(0, 104); g.lineTo(360, 0); g.lineTo(360, 220); g.lineTo(0, 116); g.closePath(); g.fill(); return c; })();

// ------------------------------------------------------------ entities
function makeCar(x, y, a, cop) {
  return { x, y, a, vx: 0, vy: 0, cop, steer: 0, thr: 0, hb: false, wp: null, prev: null, stuck: 0, rev: 0, max: cop ? 575 : 640, col: cop ? '#E8EAF2' : '#FF2E8B' };
}
let player, cops, bags, skids, floaters, cash, shown, heat, bust, busted, simT, started, shake, best;
function reset(seed) {
  rnd = mulberry32(seed);
  player = makeCar(5 * TILE, 6 * TILE, -Math.PI / 2, false);
  cops = []; bags = []; skids = []; floaters = []; cash = 0; shown = 0; heat = 0; bust = 0; busted = false; simT = 0; shake = 0;
  for (let k = 0; k < 14; k++) spawnBag();
}
function roadPoint(minD, maxD) {
  for (let tries = 0; tries < 60; tries++) {
    const horiz = rnd() < 0.5, line = Math.floor(rnd() * (N + 1)), pos = 60 + rnd() * (MAXC - 120);
    const x = horiz ? pos : line * TILE, y = horiz ? line * TILE : pos;
    const d = Math.hypot(x - player.x, y - player.y);
    if (d >= minD && d <= maxD) return [x + (horiz ? 0 : (rnd() - .5) * 40), y + (horiz ? (rnd() - .5) * 40 : 0)];
  }
  return [player.x + 900, player.y];
}
function spawnBag() { const [x, y] = roadPoint(300, 1200); bags.push({ x, y, v: 250 + Math.floor(rnd() * 9) * 250, ph: rnd() * 6 }); }
function spawnCop() {
  let best = null;
  for (let k = 0; k < 20; k++) { const i = Math.floor(rnd() * (N + 1)), j = Math.floor(rnd() * (N + 1)); const d = Math.hypot(i * TILE - player.x, j * TILE - player.y);
    if (d > 850 && d < 1400) { best = [i, j]; break; } }
  if (!best) return;
  const c = makeCar(best[0] * TILE, best[1] * TILE, Math.atan2(player.y - best[1] * TILE, player.x - best[0] * TILE), true);
  c.wp = best; cops.push(c);
}

// ------------------------------------------------------------ input
const keys = {}, touch = { l: false, r: false, gas: false, hb: false };
addEventListener('keydown', e => { keys[e.code] = true; if (!started) start(); if (busted && (e.code === 'KeyR' || e.code === 'Enter' || e.code === 'Space')) restart(); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });
const pointers = new Map();
function btnRects() { const s = Math.min(W, H) / 7.2, m = s * 0.35, y = H - s - m - (FILM ? 0 : 10 * DPR);
  return { l: [m, y, s, s], r: [m * 2 + s, y, s, s], hb: [W - m * 2 - s * 2, y, s, s], gas: [W - m - s, y, s, s] }; }
function updTouch() { touch.l = touch.r = touch.gas = touch.hb = false; const R = btnRects();
  for (const [, p] of pointers) for (const k in R) { const [x, y, w, h] = R[k]; if (p.x >= x - 20 && p.x <= x + w + 20 && p.y >= y - 30 && p.y <= y + h + 30) touch[k] = true; } }
let usedTouch = false;
cv.addEventListener('pointerdown', e => { usedTouch = usedTouch || e.pointerType !== 'mouse'; if (!started) { start(); return; } if (busted) { restart(); return; }
  pointers.set(e.pointerId, { x: e.clientX * DPR, y: e.clientY * DPR }); updTouch(); });
cv.addEventListener('pointermove', e => { if (pointers.has(e.pointerId)) { pointers.set(e.pointerId, { x: e.clientX * DPR, y: e.clientY * DPR }); updTouch(); } });
['pointerup', 'pointercancel', 'pointerleave'].forEach(n => cv.addEventListener(n, e => { pointers.delete(e.pointerId); updTouch(); }));
function start() { started = true; }
function restart() { reset(Math.floor(Math.random() * 1e9)); started = true; }

// ------------------------------------------------------------ AI: drive along the road grid
function pilot(c, tx, ty, dt) {
  const d = Math.hypot(tx - c.x, ty - c.y);
  let gx, gy;
  if (d < (c.cop ? 420 : 380) && clearLine(c.x, c.y, tx, ty)) { gx = tx; gy = ty; }
  else {
    if (!c.wp) c.wp = [Math.round(c.x / TILE), Math.round(c.y / TILE)];
    if (Math.hypot(c.wp[0] * TILE - c.x, c.wp[1] * TILE - c.y) < 95) {
      const cur = c.wp; let bestN = null, bestS = 1e9;
      for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const ni = cur[0] + di, nj = cur[1] + dj; if (ni < 0 || nj < 0 || ni > N || nj > N) continue;
        let s = Math.abs(ni * TILE - tx) + Math.abs(nj * TILE - ty) + rnd() * 120;
        if (c.prev && c.prev[0] === ni && c.prev[1] === nj) s += 2000;
        if (s < bestS) { bestS = s; bestN = [ni, nj]; }
      }
      c.prev = cur; c.wp = bestN;
    }
    gx = c.wp[0] * TILE; gy = c.wp[1] * TILE;
    if (!clearLine(c.x, c.y, gx, gy)) { const ni = Math.round(c.x / TILE), nj = Math.round(c.y / TILE); const ax = Math.abs(c.x - ni * TILE) < Math.abs(c.y - nj * TILE); gx = ax ? ni * TILE : c.x + Math.cos(c.a) * 60; gy = ax ? c.y + Math.sign(gy - c.y) * 80 : nj * TILE; }
  }
  const want = Math.atan2(gy - c.y, gx - c.x), diff = angDiff(c.a, want), sp = Math.hypot(c.vx, c.vy);
  c.steer = clamp(diff * 2.4, -1, 1);
  c.thr = 1 - Math.min(0.55, Math.abs(diff) * 0.45);
  c.hb = Math.abs(diff) > 0.75 && sp > 330;
  if (c.rev > 0) { c.rev -= dt; c.thr = -1; c.steer = -c.steer; c.hb = false; }
  else if (sp < 45) { c.stuck += dt; if (c.stuck > 0.6) { c.rev = 0.6; c.stuck = 0; c.wp = [Math.round(c.x / TILE), Math.round(c.y / TILE)]; c.prev = null; } } else c.stuck = 0;
}

function clearLine(x0, y0, x1, y1) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 18);
  for (let k = 1; k < n; k++) { const x = lerp(x0, x1, k / n), y = lerp(y0, y1, k / n);
    for (const b of nearBuildings(Math.floor(x / TILE), Math.floor(y / TILE))) if (x > b.x0 - 22 && x < b.x1 + 22 && y > b.y0 - 22 && y < b.y1 + 22) return false; }
  return true;
}
// ------------------------------------------------------------ physics
function physics(c, dt) {

    if (busted) overlay(['BUSTED', 'You made $' + cash.toLocaleString('en-US') + (best > cash ? ' · best $' + best.toLocaleString('en-US') : ''), 'Tap or press R to drive again', '']);
  }
}
function starPath(x, y, r) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); } ctx.closePath(); }
function overlay(lines) {
  const u = Math.min(W, H) / 1080; ctx.fillStyle = 'rgba(7,5,12,.66)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `400 ${Math.round(150 * u)}px Anton`; ctx.fillStyle = lines[0] === 'BUSTED' ? '#ff3050' : '#FF2E8B'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 30 * u;
  ctx.fillText(lines[0], W / 2, H * 0.4); ctx.shadowBlur = 0;
  ctx.font = `600 ${Math.round(40 * u)}px Inter`; ctx.fillStyle = '#F4F2F7'; ctx.fillText(lines[1], W / 2, H * 0.4 + 120 * u);
  ctx.font = `700 ${Math.round(30 * u)}px "JetBrains Mono"`; ctx.fillStyle = '#2EE6FF'; ctx.fillText(lines[2], W / 2, H * 0.4 + 190 * u);
  ctx.font = `600 ${Math.round(24 * u)}px Inter`; ctx.fillStyle = 'rgba(244,242,247,.5)'; ctx.fillText(lines[3], W / 2, H - 80 * u);
}

// ------------------------------------------------------------ film captions (only with ?film=1)
const CAP = [
  { a: 0.0, b: 3.2, dim: .62, lines: [['GTA 6 IS OUT TODAY.', 'anton', 118, '#F4F2F7'], ['$79.99 · PS5 / Xbox only · 212 GB on PS5', 'inter', 40, 'rgba(244,242,247,.8)']] },
  { a: 3.2, b: 5.6, dim: .62, lines: [['NO PC VERSION.', 'anton', 150, '#FF2E8B']] },
  { a: 5.6, b: 8.6, dim: .5, lines: [['So I asked Claude', 'inter', 72, '#F4F2F7'], ['to build one that runs', 'inter', 72, '#F4F2F7'], ['in a browser tab.', 'inter', 72, '#2EE6FF'], ['0 GB · free · works on your phone', 'mono', 34, 'rgba(244,242,247,.75)']] },
  { a: 9.0, b: 12.2, chip: 'hold DRIFT. grab the cash.' },
  { a: 12.6, b: 15.8, chip: 'every bag = more heat' },
  { a: 16.2, b: 20.2, chip: '5 stars. good luck.' },
  { a: 20.6, b: 24.2, dim: .7, lines: [['NEON COAST', 'anton', 170, '#FF2E8B'], ['Built by Claude. Play it free.', 'inter', 52, '#F4F2F7'], ['link in reply', 'mono', 40, '#2EE6FF']], foot: 'Fan-made original. Not affiliated with Rockstar Games.' },
];
const FONT = { anton: s => `400 ${s}px Anton`, inter: s => `800 ${s}px Inter`, mono: s => `700 ${s}px "JetBrains Mono"` };
function captions(t) {
  for (const c of CAP) {
    if (t < c.a || t >= c.b) continue;
    const inP = clamp((t - c.a) / 0.25, 0, 1), outP = clamp((c.b - t) / 0.2, 0, 1), op = Math.min(inP, outP);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (c.chip) { ctx.font = FONT.mono(36); const w = ctx.measureText(c.chip).width + 70, y = 1560 + (1 - inP) * 30;
      ctx.globalAlpha = op; rr(W / 2 - w / 2, y - 40, w, 80, 40); ctx.fillStyle = 'rgba(10,7,16,.82)'; ctx.fill(); ctx.strokeStyle = '#FF2E8B'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#F4F2F7'; ctx.fillText(c.chip, W / 2, y + 2); ctx.globalAlpha = 1; continue; }
    ctx.fillStyle = `rgba(7,5,12,${c.dim * op})`; ctx.fillRect(0, 0, W, H);
    let total = 0; for (const l of c.lines) total += l[2] * 1.25; let y = H * 0.46 - total / 2;
    c.lines.forEach((l, i) => { const p = clamp((t - c.a - i * 0.12) / 0.3, 0, 1), e = 1 - Math.pow(1 - p, 3);
      ctx.font = FONT[l[1]](l[2]); ctx.fillStyle = l[3]; ctx.globalAlpha = op * e;
      if (l[1] === 'anton') { ctx.shadowColor = l[3]; ctx.shadowBlur = 24; }
      ctx.fillText(l[0], W / 2, y + l[2] * 0.62 + (1 - e) * 40); ctx.shadowBlur = 0; y += l[2] * 1.25; });
    if (c.foot) { ctx.globalAlpha = op; ctx.font = '600 28px Inter'; ctx.fillStyle = 'rgba(244,242,247,.55)'; ctx.fillText(c.foot, W / 2, H - 150); }
    ctx.globalAlpha = 1;
  }
  // brand
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#FF2E8B'; ctx.beginPath(); ctx.arc(60, 80, 9, 0, 7); ctx.fill();
  ctx.font = '800 30px Inter'; ctx.fillStyle = 'rgba(244,242,247,.85)'; ctx.fillText('OCTANEWIRE', 82, 81);
  ctx.textAlign = 'right'; ctx.font = '700 24px "JetBrains Mono"'; ctx.fillStyle = 'rgba(244,242,247,.55)'; ctx.fillText('REAL GAMEPLAY · BUILT BY CLAUDE', W - 50, 81);
}

// ------------------------------------------------------------ boot
buildWorld(7); indexBuildings(); reset(FILM ? (+Q.get('seed') || 20261119) : Math.floor(Math.random() * 1e9));
cam.x = player.x; cam.y = player.y;
const fontsReady = Promise.all(['400 40px Anton', '800 40px Inter', '600 40px Inter', '700 40px "JetBrains Mono"'].map(f => document.fonts.load(f))).catch(() => {});
if (FILM) {
  started = true; window.DURATION = 24; window.FPS = 30;
  window.dbg = () => ({p:[player.x|0,player.y|0], cam:[cam.x|0,cam.y|0], sp:Math.hypot(player.vx,player.vy)|0, heat, cops:cops.length});
  window.seek = t => { while (simT < t - 1e-6) step(1 / 60, true); draw(t); captions(t); };
  fontsReady.then(() => { window.seek(0); window.__READY = true; });
} else {
  let last = performance.now(), acc = 0;
  const loop = now => { acc += Math.min(0.1, (now - last) / 1000); last = now;
    while (acc >= 1 / 60) { if (started) step(1 / 60, false); else { simT += 1 / 60; } acc -= 1 / 60; }
    draw(now / 1000); requestAnimationFrame(loop); };
  fontsReady.then(() => requestAnimationFrame(loop));
}
})();
